\* 壊したモデル: S5 取り消しの ioctl は再生が終わってから戻る（StopWaitsEnd）
\* 注入する故障 StopNoWait: 取り消しの印を付けたら、再生の終わりを待たずに戻る。
\* 期待する結果: Error: Invariant StopWaitsEnd is violated.
\* 検査する性質はこの1つだけにし、デッドロック検査は切る（ほかの理由で止まらないように）。
SPECIFICATION Spec

CONSTANTS
    Pages    <- MC_Pages
    Vnodes   <- MC_Vnodes
    FS       <- MC_FS
    UmountFs <- MC_UmountFs
    FileOf   <- MC_FileOf
    FsOf     <- MC_FsOf
    Readers  <- MC_Readers
    Script   <- MC_Script
    Budget   = 2
    MaxIO    = 2
    Runs     = 2
    Bug      = "StopNoWait"

INVARIANT StopWaitsEnd

CHECK_DEADLOCK FALSE
