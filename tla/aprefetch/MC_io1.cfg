\* 正しいモデル（予算2ページ、同時I/O上限1、再生2回）。I/O数の上限で眠る経路も通す。
SPECIFICATION Spec

CONSTANTS
    Pages    <- MC_Pages
    Vnodes   <- MC_Vnodes
    FS       <- MC_FS
    UmountFs <- MC_UmountFs
    FileOf   <- MC_FileOf
    FsOf     <- MC_FsOf
    Readers  <- MC_Readers
    Script   <- MC_Script
    Budget   = 2
    MaxIO    = 1
    Runs     = 2
    Bug      = "none"

INVARIANTS
    TypeOK
    BudgetOK
    UnmountedNoRefs
    NoDoublePrefetch
    NoDuplicateIO
    IOHoldsRef
    IOLimit
    CancelOnlyTarget
    StopWaitsEnd

PROPERTIES
    ReadsComplete
    UnmountCompletes
    ReplayTerminates
    ReplayReleasesAll
    StopCompletes
