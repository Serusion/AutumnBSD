\* 正しいモデルを大きくしたもの。anon 3つ、スロット4つ、まとまり3ページまで、
\* プールの枠2つ。安全性を検査する。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons3
    KindOf     <- MC_KindOf3
    NSlots     = 4
    MaxVer     = 1
    PoolMax    = 2
    ClusterMax = 3
    Toggle     = FALSE
    Swapoff    = FALSE
