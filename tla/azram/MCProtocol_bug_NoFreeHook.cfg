\* 壊したモデル: S8 全部が解放されたら azram には何も残らない（CleanAtEnd）
\* 注入する故障 NoFreeHook: uvm_swap_free が azram_free を呼ばない。解放した anon のエントリが残る。
\* 期待する結果: Error: Invariant CleanAtEnd is violated.
\* 検査する性質はこの1つだけにし、デッドロック検査は切る（ほかの理由で止まらないように）。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = FALSE
    Bug        = "NoFreeHook"

INVARIANT CleanAtEnd

CHECK_DEADLOCK FALSE
