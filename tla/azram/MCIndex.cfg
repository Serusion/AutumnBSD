\* 正しいモデル。主体2つ、葉2枚（1枚は swap_on で足す）、ロック2つ。
\* azram_free は1回のロックで語を1つずつ外す。すべての性質を検査する。
SPECIFICATION Spec

CONSTANTS
    Threads   <- MC_Threads
    LeafSize  = 2
    NLeaves1  = 1
    NLeaves2  = 1
    NLocks    = 2
    PoolMax   = 2
    MaxRun    = 2
    FreeBatch = 1
    Bug       = "none"

INVARIANTS
    TypeOK
    IndexOK
    LoadOK
    NoStaleInsert
    CountOK
    LeavesOK
    BudgetOK
    ChunksOK
    Covered

PROPERTIES
    Progress
