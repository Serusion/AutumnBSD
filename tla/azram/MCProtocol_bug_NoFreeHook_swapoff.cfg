\* 壊したモデル: S9 swapctl -d が通ったら azram に何も残らない（SwapoffClean）
\* 注入する故障 NoFreeHook: uvm_swap_free が azram_free を呼ばない。返したスロットのエントリが残ったまま swapctl -d が通る。
\* 期待する結果: Error: Invariant SwapoffClean is violated.
\* 検査する性質はこの1つだけにし、デッドロック検査は切る（ほかの理由で止まらないように）。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = TRUE
    Bug        = "NoFreeHook"

INVARIANT SwapoffClean

CHECK_DEADLOCK FALSE
