\* 正しいモデルに swapctl -d を入れたもの。安全性（不変条件）を検査する。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = TRUE
    Bug        = "none"

INVARIANTS
    TypeOK
    DataOK
    SlotOK
    FreeNotIndexed
    NoStaleInsert
    CountCovers
    BudgetOK
    Owned
    CleanAtEnd
    SwapoffClean
