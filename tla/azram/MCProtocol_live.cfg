\* 正しいモデルの活性。swapctl -d と vm.azram.enable の切り替えを入れ、
\* 始まったページイン、ページアウト、swapctl -d が終わることを検査する。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = TRUE
    Bug        = "none"

PROPERTIES
    PageinsComplete
    PageoutsComplete
    SwapoffEnds
