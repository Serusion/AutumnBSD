\* 壊したモデル: L2 始まったページアウトは終わる（PageoutsComplete）
\* 注入する故障 ForgetStored: azram が格納したページを完了させない。書き込みがないので、ページが busy のまま残る。
\* 期待する結果: Error: Temporal property PageoutsComplete was violated.
\* 検査する性質はこの1つだけにし、デッドロック検査は切る（ほかの理由で止まらないように）。
SPECIFICATION FullSpec

