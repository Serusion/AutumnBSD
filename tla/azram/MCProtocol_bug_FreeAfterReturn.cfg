\* 壊したモデル: S1 プロセスが見るページの中身は最後に書いた値（DataOK）
\* 注入する故障 FreeAfterReturn: uvm_swap_free がスロットを blist に返してから、エントリを捨てる。その間にスロットが別のページに使われ、古いエントリが読まれる。
\* 期待する結果: Error: Invariant DataOK is violated.
\* 検査する性質はこの1つだけにし、デッドロック検査は切る（ほかの理由で止まらないように）。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = FALSE
    Bug        = "FreeAfterReturn"

INVARIANT DataOK

CHECK_DEADLOCK FALSE
