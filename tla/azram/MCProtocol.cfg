\* 正しいモデル。anon 2つ、スロット3つ、まとまり2ページまで、プールの枠1つ。
\* vm.azram.enable の切り替えあり。安全性（不変条件）を検査する。
SPECIFICATION FullSpec

CONSTANTS
    Anons      <- MC_Anons
    KindOf     <- MC_KindOf
    NSlots     = 3
    MaxVer     = 1
    PoolMax    = 1
    ClusterMax = 2
    Toggle     = TRUE
    Swapoff    = FALSE
    Bug        = "none"

INVARIANTS
    TypeOK
    DataOK
    SlotOK
    FreeNotIndexed
    NoStaleInsert
    CountCovers
    BudgetOK
    Owned
    CleanAtEnd
